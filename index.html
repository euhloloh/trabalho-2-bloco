<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Página</title>
</head>

<body>

    <h1>Mensagem de Tecnologia</h1>

    <p class="mensagem">Clique no botão para ver uma mensagem.</p>

    <button class="botao">Clique aqui</button>

    <script>
        const botao = document.querySelector(".botao");
        const mensagem = document.querySelector(".mensagem");

        function mostrarMensagem() {
            mensagem.textContent = "A tecnologia está presente no nosso dia a dia!";
        }

        botao.addEventListener("click", mostrarMensagem);
    </script>

</body>
</html>
